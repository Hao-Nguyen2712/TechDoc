name: techdoc

services:
  postgres:
    image: postgres:18
    container_name: techdoc-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-techdoc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-techdoc}
      POSTGRES_DB: ${POSTGRES_DB:-techdoc}
    ports:
      - "5432:5432"
    volumes:
      # postgres:18 changed PGDATA to /var/lib/postgresql/18/docker — mount the parent, not .../data
      - ./data/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1
    container_name: techdoc-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./data/qdrant/storage:/qdrant/storage
      - ./data/qdrant/snapshots:/qdrant/snapshots
    # image ships bash but no curl/wget — probe the HTTP port via bash /dev/tcp
    # (must invoke bash explicitly: CMD-SHELL runs /bin/sh, which is dash here and lacks /dev/tcp)
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: techdoc-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-techdoc}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-techdocdev}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./data/minio:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: techdoc-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-techdoc}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-techdocdev}
    restart: "no"
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/documents &&
      echo 'bucket documents ready'
      "
